name: offline_chat
description: Offline peer-to-peer chat over Bluetooth/WiFi Direct (no internet required)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nearby_connections: ^3.3.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
